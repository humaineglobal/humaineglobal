<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1538"/>
      <stop offset="50%" stop-color="#1a2148"/>
      <stop offset="100%" stop-color="#0a0f2d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>
  
  <!-- Central glow -->
  <circle cx="600" cy="450" r="400" fill="url(#glow)"/>
  
  <!-- Dot grid pattern -->
  <g opacity="0.06">
    <circle cx="50" cy="50" r="2" fill="white"/>
    <circle cx="100" cy="50" r="2" fill="white"/>
    <circle cx="150" cy="50" r="2" fill="white"/>
    <circle cx="200" cy="50" r="2" fill="white"/>
    <circle cx="250" cy="50" r="2" fill="white"/>
    <circle cx="300" cy="50" r="2" fill="white"/>
    <circle cx="350" cy="50" r="2" fill="white"/>
    <circle cx="400" cy="50" r="2" fill="white"/>
    <circle cx="450" cy="50" r="2" fill="white"/>
    <circle cx="500" cy="50" r="2" fill="white"/>
    <circle cx="550" cy="50" r="2" fill="white"/>
    <circle cx="600" cy="50" r="2" fill="white"/>
    <circle cx="650" cy="50" r="2" fill="white"/>
    <circle cx="700" cy="50" r="2" fill="white"/>
    <circle cx="750" cy="50" r="2" fill="white"/>
    <circle cx="800" cy="50" r="2" fill="white"/>
    <circle cx="850" cy="50" r="2" fill="white"/>
    <circle cx="900" cy="50" r="2" fill="white"/>
    <circle cx="950" cy="50" r="2" fill="white"/>
    <circle cx="1000" cy="50" r="2" fill="white"/>
    <circle cx="1050" cy="50" r="2" fill="white"/>
    <circle cx="1100" cy="50" r="2" fill="white"/>
    <circle cx="1150" cy="50" r="2" fill="white"/>
  </g>
  
  <!-- Human silhouette (left) -->
  <g transform="translate(250, 350)">
    <!-- Head -->
    <circle cx="100" cy="50" r="40" fill="#3b82f6" opacity="0.9"/>
    <!-- Body -->
    <path d="M60 90 Q100 110 140 90 L150 200 Q100 220 50 200 Z" fill="#3b82f6" opacity="0.7"/>
    <!-- Arms -->
    <path d="M60 110 Q20 140 30 180" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M140 110 Q180 140 170 180" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Reach line toward center -->
    <path d="M170 180 Q250 220 300 250" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="8,4" fill="none"/>
  </g>
  
  <!-- AI node (right) -->
  <g transform="translate(700, 300)">
    <!-- Central AI core -->
    <circle cx="150" cy="150" r="80" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
    <circle cx="150" cy="150" r="60" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
    <circle cx="150" cy="150" r="40" fill="#3b82f6" opacity="0.9"/>
    <text x="150" y="160" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="28" font-weight="bold">AI</text>
    
    <!-- Connection nodes -->
    <circle cx="50" cy="80" r="15" fill="#3b82f6" opacity="0.7"/>
    <circle cx="250" cy="80" r="15" fill="#3b82f6" opacity="0.7"/>
    <circle cx="50" cy="220" r="15" fill="#3b82f6" opacity="0.7"/>
    <circle cx="250" cy="220" r="15" fill="#3b82f6" opacity="0.7"/>
    
    <!-- Connection lines -->
    <line x1="65" y1="95" x2="110" y2="130" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
    <line x1="235" y1="95" x2="190" y2="130" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
    <line x1="65" y1="205" x2="110" y2="170" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
    <line x1="235" y1="205" x2="190" y2="170" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
    
    <!-- Data particles -->
    <circle cx="150" cy="50" r="4" fill="#60a5fa"/>
    <circle cx="150" cy="250" r="4" fill="#60a5fa"/>
    <circle cx="30" cy="150" r="4" fill="#60a5fa"/>
    <circle cx="270" cy="150" r="4" fill="#60a5fa"/>
    
    <!-- Reach line toward center -->
    <path d="M150 230 Q400 300 300 250" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="8,4" fill="none"/>
  </g>
  
  <!-- Central connection visualization -->
  <g transform="translate(400, 350)">
    <!-- Connecting bridge -->
    <path d="M100 100 Q200 50 300 100" stroke="#3b82f6" stroke-width="4" fill="none" opacity="0.8"/>
    <path d="M100 150 Q200 200 300 150" stroke="#3b82f6" stroke-width="4" fill="none" opacity="0.8"/>
    
    <!-- Center merge point -->
    <circle cx="200" cy="125" r="30" fill="#3b82f6" opacity="0.3"/>
    <circle cx="200" cy="125" r="15" fill="#3b82f6" opacity="0.8"/>
    
    <!-- Pulse rings -->
    <circle cx="200" cy="125" r="40" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <circle cx="200" cy="125" r="55" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.2"/>
  </g>
  
  <!-- Floating data elements -->
  <g opacity="0.6">
    <!-- Left side data -->
    <rect x="180" y="200" width="60" height="8" rx="4" fill="#3b82f6"/>
    <rect x="200" y="220" width="40" height="8" rx="4" fill="#60a5fa"/>
    <rect x="190" y="240" width="50" height="8" rx="4" fill="#3b82f6"/>
    
    <!-- Right side data -->
    <rect x="900" y="200" width="60" height="8" rx="4" fill="#3b82f6"/>
    <rect x="920" y="220" width="40" height="8" rx="4" fill="#60a5fa"/>
    <rect x="910" y="240" width="50" height="8" rx="4" fill="#3b82f6"/>
  </g>
  
  <!-- Bottom tagline area -->
  <g transform="translate(600, 700)">
    <text x="0" y="0" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="500" letter-spacing="2">HUMAN-CENTERED AI</text>
    <text x="0" y="30" text-anchor="middle" fill="white" opacity="0.7" font-family="Inter, sans-serif" font-size="12">Where human expertise meets AI precision</text>
  </g>
</svg>