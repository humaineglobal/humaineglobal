<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2148"/>
      <stop offset="100%" stop-color="#0d1538"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#heroGrad)"/>
  <circle cx="400" cy="400" r="200" fill="url(#glow)"/>
  <!-- Person silhouette -->
  <ellipse cx="400" cy="350" rx="80" ry="90" fill="#3b82f6" opacity="0.8"/>
  <circle cx="400" cy="260" r="50" fill="#3b82f6" opacity="0.9"/>
  <!-- AI Interface elements -->
  <rect x="250" y="450" width="300" height="200" rx="20" fill="white" fill-opacity="0.1" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="320" cy="520" r="30" fill="#3b82f6" opacity="0.6"/>
  <circle cx="400" cy="520" r="30" fill="#60a5fa" opacity="0.6"/>
  <circle cx="480" cy="520" r="30" fill="#3b82f6" opacity="0.6"/>
  <rect x="280" y="580" width="240" height="12" rx="6" fill="#3b82f6" opacity="0.4"/>
  <text x="400" y="750" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="24" font-weight="bold">AI Strategy Consulting</text>
</svg>