<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none">
  <rect width="600" height="700" fill="#f8fafc"/>
  <!-- Executive portrait silhouette -->
  <ellipse cx="300" cy="280" rx="100" ry="120" fill="#e2e8f0"/>
  <circle cx="300" cy="180" r="60" fill="#cbd5e1"/>
  <!-- Suit/shoulders -->
  <path d="M200 400 Q200 350 250 330 L350 330 Q400 350 400 400 L400 700 L200 700 Z" fill="#94a3b8"/>
  <!-- Tie -->
  <rect x="290" y="330" width="20" height="80" rx="2" fill="#3b82f6"/>
  <!-- Background -->
  <rect x="0" y="500" width="600" height="200" fill="#e2e8f0"/>
  <text x="300" y="650" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="16">Executive Portrait</text>
</svg>